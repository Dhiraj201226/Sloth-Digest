services:
  sloth-digest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sloth-digest
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - DEFAULT_MODEL=qwen2.5:1.5b
    volumes:
      - ./data:/app/data
      - ./watched_chats:/app/watched_chats
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: sloth-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
